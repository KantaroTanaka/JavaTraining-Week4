<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

    <nav th:replace="~{layout :: header}"></nav>

    <h2>タスク一覧</h2>

    <a href="/tasks/new" class="btn btn-primary">新規作成</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>タスク名</th>
                <th>完了</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.id}">1</td>
                <td th:text="${task.title}">サンプルのタスク</td>
                <td th:text="${task.completed ? '完了' : '未完了'}">未完了</td>
                <td>
                    <a th:href="@{/tasks/{id}/edit(id=${task.id})}" 
                        class="btn" style="background-color: #ffc107; color: black; margin-right: 5px;">編集</a>

                    <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('本当に削除しますか？');">削除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
