<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

    <nav th:replace="~{layout :: header}"></nav>

    <div style="width: 500px; margin: 0 auto;">
        <h2 th:text="${mode == 'edit'} ? 'タスク編集' : 'タスク新規登録'">タスク登録</h2>

            <form th:action="${mode == 'edit'} ? @{/tasks/{id}/edit(id=${taskId})} : @{/tasks}"th:object="${taskForm}" method="post">

        <div style="margin-bottom: 15px;">
            <label for="title">タスク名</label>
            <input type="text" id="title" th:field="*{title}" style="width: 100%; padding: 8px;">
            <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color: red;"></div>
        </div>

        <button type="submit" class="btn btn-primary" 
            th:text="${mode == 'edit'} ? '更新する' : '登録する'">登録する</button>
    
        <a href="/tasks" class="btn" style="background-color: #6c757d; color: white; margin-left: 10px;">キャンセル</a>

            </form>
    </div>

</body>
</html>
